<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2244 Crew Cockpit Terminal</title>
<style>
body {font-family:'Fira Code',monospace;background:#272822;color:#f8f8f2;margin:0;padding:0;}
header {padding:15px;text-align:center;background:#1e1e1e;color:#f92672;}
textarea {width:95%;min-height:100px;margin:10px auto;display:block;}
button {background:#f92672;color:#f8f8f2;border:none;padding:10px 20px;margin:auto;display:block;}
#liveConsole {background:#1b1b1b;color:#f8f8f2;padding:15px;margin:15px auto;max-height:500px;overflow-y:auto;white-space:pre-wrap;}
</style>
</head>
<body>
<header><h1>2244 Crew Cockpit</h1></header>
<textarea id="crewPrompt" placeholder="Enter prompt..."></textarea>
<button onclick="sendPrompt()">🚀 Send</button>
<pre id="liveConsole">-- Cockpit Ready --</pre>
<script>
async function sendPrompt() {
    const prompt=document.getElementById('crewPrompt').value;
    if(!prompt) return;
    const res=await fetch('http://localhost:11434/api/generate',{
        method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({model:'gemma3:1b',prompt})
    });
    const data=await res.json();
    document.getElementById('liveConsole').textContent+=`\\n[AI] ${data.response}`;
}
</script>
</body>
</html>
