<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2244 Crew Cockpit Terminal</title>
<style>
body {margin:0;padding:0;font-family:'Fira Code',monospace;background:#272822;color:#f8f8f2;}
header {background:#1e1e1e;padding:15px;text-align:center;box-shadow:0 4px 8px rgba(0,0,0,0.3);}
h1 {margin:0;font-size:2em;color:#f92672;}
textarea {width:95%;min-height:100px;background:#272822;border:1px solid #66d9ef;color:#f8f8f2;padding:10px;border-radius:4px;resize:vertical;margin:10px auto;display:block;font-family:monospace;}
button {background:#f92672;color:#f8f8f2;border:none;padding:10px 20px;margin:5px; border-radius:4px;font-weight:bold;cursor:pointer;transition:0.3s;display:block;margin:auto;}
button:hover {background:#fd5f7a;}
#liveConsole {background:#1b1b1b;color:#f8f8f2;padding:15px;border:2px solid #66d9ef;margin:15px auto;border-radius:5px;max-height:500px;overflow-y:auto;font-family:monospace;white-space:pre-wrap;}
footer {text-align:center;padding:15px;font-size:0.8em;color:#75715e;}
</style>
</head>
<body>
<header>
<h1>2244 Crew Cockpit Terminal</h1>
<p>Realtime Stream of Core, Loop, Code, Coin, 2244, Neuro & Crew Pool</p>
</header>

<textarea id="crewPrompt" placeholder="Enter prompt for all agents and crew pool..."></textarea>
<button onclick="crewSend()">🚀 Send to Crew</button>
<pre id="liveConsole">-- Cockpit ready --</pre>

<footer>© 2025 2244 Crew | Parallel Streaming Terminal</footer>

<script>
const consoleEl = document.getElementById('liveConsole');

// Append log line
function appendLog(line) {
    consoleEl.textContent += line + "\n";
    consoleEl.scrollTop = consoleEl.scrollHeight;
}

// Send prompt to ai.sh via local API (or terminal wrapper)
async function sendPromptToAI(prompt) {
    appendLog(`[Cockpit] Sending prompt to ai.sh...`);
    try {
        const response = await fetch('http://localhost:5000/run', { // ai.sh exposed via small local HTTP wrapper
            method: 'POST',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify({prompt})
        });
        if(!response.ok) throw new Error(`HTTP ${response.status}`);
        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        while(true){
            const {value, done} = await reader.read();
            if(done) break;
            const chunk = decoder.decode(value,{stream:true});
            appendLog(chunk);
        }
        appendLog("[Cockpit] ✅ Crew completed.");
    } catch(e) {
        appendLog(`[Cockpit] ❌ Error: ${e.message}`);
    }
}

function crewSend() {
    const prompt = document.getElementById('crewPrompt').value;
    if(!prompt) return appendLog('[Cockpit] ⚠ Prompt empty!');
    const btn = document.querySelector('button');
    btn.disabled = true;
    sendPromptToAI(prompt).finally(()=>btn.disabled=false);
}
</script>
</body>
</html>
