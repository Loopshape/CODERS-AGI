<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>2244 Atom Cockpit</title>
<style>
  html, body { margin:0; padding:0; background:black; overflow:hidden; height:100%; }
  canvas { display:block; }
  #stats { position:absolute; top:10px; left:10px; color:#0f0; font-family:monospace; }
</style>
</head>
<body>
<div id="stats">Loading...</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.0/dist/gsap.min.js"></script>

<script>
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 1000);
camera.position.z = 5;

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

// Atom nucleus
const nucleus = new THREE.Mesh(
  new THREE.SphereGeometry(0.5, 32, 32),
  new THREE.MeshPhongMaterial({color:0xff0040, emissive:0x550000})
);
scene.add(nucleus);

// Electrons
const electrons = [];
for(let i=0;i<5;i++){
  let geom = new THREE.SphereGeometry(0.1,16,16);
  let mat = new THREE.MeshPhongMaterial({color:0x00ffff, emissive:0x005555});
  let mesh = new THREE.Mesh(geom, mat);
  mesh.userData = {angle:Math.random()*Math.PI*2, radius:1+Math.random()*1.5, speed:0.01+Math.random()*0.02};
  electrons.push(mesh);
  scene.add(mesh);
}

// Lights
const light1 = new THREE.PointLight(0xffffff,1);
light1.position.set(10,10,10);
scene.add(light1);
const ambient = new THREE.AmbientLight(0x111111);
scene.add(ambient);

// WebSocket for live agent JSON
const statsDiv = document.getElementById('stats');
let ws = new WebSocket('ws://localhost:8080/');
ws.onmessage = (msg)=>{
  try{
    let data = JSON.parse(msg.data);
    statsDiv.textContent = `Timestamp:${data.timestamp} Memories:${data.memories} Logs:${data.logs}`;
  }catch(e){}
};

function animate(){
  requestAnimationFrame(animate);
  
  electrons.forEach(e=>{
    e.userData.angle += e.userData.speed;
    e.position.x = Math.cos(e.userData.angle)*e.userData.radius;
    e.position.y = Math.sin(e.userData.angle)*e.userData.radius;
  });

  nucleus.rotation.y += 0.002;
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
