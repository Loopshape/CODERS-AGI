<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Hierarchical AI Word Bubble</title>
<style>
html,body { margin:0; padding:0; overflow:hidden; background:black; }
canvas { display:block; }
#verboseOverlay{
  position:absolute; bottom:0; left:0; width:100%; max-height:200px;
  overflow-y:auto; background:rgba(0,0,0,0.6); color:#0f0; padding:5px;
  font-size:12px; box-sizing:border-box; font-family:monospace; z-index:10;
}
</style>
</head>
<body>
<canvas id="wordCanvas"></canvas>
<div id="verboseOverlay"></div>
<script>
const canvas=document.getElementById('wordCanvas');
const ctx=canvas.getContext('2d');
canvas.width=window.innerWidth;
canvas.height=window.innerHeight;
const cx=canvas.width/2, cy=canvas.height/2;
const verboseOverlay=document.getElementById('verboseOverlay');

// ---------------- Agent Class ----------------
class Agent {
  constructor(id){
    this.id=id;
    this.pool=[];
    this.memory=[];
  }
  spawnToken(word, meta){
    let token={
      id:'T'+Math.floor(Math.random()*10000),
      word:word,
      semantic:[word],
      metaTopic:meta,
      orbit:150+50*(5-meta), // higher meta closer to center
      angle:Math.random()*Math.PI*2,
      speed:0.002+Math.random()*0.003,
      lift:0,
      brightness:1,
      x:0,y:0,z:0,
      active:true,
      history:[]
    };
    this.pool.push(token);
    log(this,'spawn',token);
    return token;
  }
  fuseTokens(tokenA,tokenB){
    if(!tokenA.active||!tokenB.active) return null;
    let newMeta = Math.max(tokenA.metaTopic, tokenB.metaTopic);
    let newToken={
      id:'F'+Math.floor(Math.random()*10000),
      word:tokenA.word+'-'+tokenB.word,
      semantic:[...new Set([...tokenA.semantic,...tokenB.semantic])],
      metaTopic:newMeta,
      orbit:150+50*(5-newMeta),
      angle:(tokenA.angle+tokenB.angle)/2,
      speed:(tokenA.speed+tokenB.speed)/2,
      lift:0,
      brightness:1.5,
      x:0,y:0,z:0,
      active:true,
      history:[...tokenA.history,...tokenB.history,`Fusion by Agent ${this.id}`]
    };
    tokenA.active=tokenB.active=false;
    this.pool.push(newToken);
    log(this,'fusion',tokenA,tokenB);
    return newToken;
  }
  neuroPulse(){
    this.pool.forEach(t=>{if(t.active) t.brightness=1+Math.random()*0.3;});
    log(this,'pulse');
  }
  autoEvolve(){
    // Random fusion among active tokens
    let activeTokens = this.pool.filter(t=>t.active);
    if(activeTokens.length>1){
      let a=activeTokens[Math.floor(Math.random()*activeTokens.length)];
      let b=activeTokens[Math.floor(Math.random()*activeTokens.length)];
      if(a!==b) this.fuseTokens(a,b);
    }
    // Randomly spawn new token
    if(Math.random()<0.01){
      const wordList=["Entropy","Dream","Fusion","Vision","Energy","Neuro","Token","Pulse","Cosmos","Logic"];
      let word=wordList[Math.floor(Math.random()*wordList.length)];
      this.spawnToken(word,1+Math.floor(Math.random()*5));
    }
    // Random pulse
    if(Math.random()<0.05) this.neuroPulse();
  }
}

// ---------------- Logging ----------------
function log(agent, action, token=null, other=null){
  let sentence="";
  switch(action){
    case "spawn": sentence=`Agent ${agent.id} spawns "${token.word}" [meta ${token.metaTopic}].`; break;
    case "fusion": sentence=`Agent ${agent.id} fused "${token.word}" with "${other.word}" → new token.`; break;
    case "pulse": sentence=`Agent ${agent.id} pulses active tokens.`; break;
  }
  agent.memory.push({sentence,timestamp:Date.now()});
  if(agent.memory.length>10) agent.memory.shift();
  const vline=document.createElement('div'); vline.textContent=sentence;
  verboseOverlay.appendChild(vline);
  verboseOverlay.scrollTop=verboseOverlay.scrollHeight;
}

// ---------------- Agents and Words ----------------
const agents=[new Agent(0),new Agent(1)];
const words=["Entropy","Dream","Fusion","Vision","Energy","Neuro","Token","Pulse","Cosmos","Logic"];
agents.forEach(agent=>words.forEach(w=>agent.spawnToken(w,1+Math.floor(Math.random()*5))));

// ---------------- 3D Setup ----------------
let angleX=0.002, angleY=0.003;
function rotate3D(t){
  let y=t.y*Math.cos(angleX)-t.z*Math.sin(angleX);
  let z=t.y*Math.sin(angleX)+t.z*Math.cos(angleX);
  t.y=y;t.z=z;
  let x=t.x*Math.cos(angleY)+t.z*Math.sin(angleY);
  z=-t.x*Math.sin(angleY)+t.z*Math.cos(angleY);
  t.x=x;t.z=z;
}

// ---------------- Animation ----------------
function animate(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  agents.forEach(agent=>{
    agent.autoEvolve(); 
    agent.pool.forEach(t=>{
      if(!t.active) return;
      t.angle+=t.speed;
      t.x=Math.cos(t.angle)*t.orbit;
      t.y=Math.sin(t.angle)*t.orbit;
      t.z=Math.sin(t.angle*0.5)*t.orbit/2;
      rotate3D(t);
      const scale=500/(500+t.z);
      const x2d=cx+t.x*scale;
      const y2d=cy+t.y*scale;
      const fontSize=16*scale*t.metaTopic;
      ctx.fillStyle=`rgba(0,255,255,${0.3+0.7*scale})`;
      ctx.font=`${fontSize}px monospace`;
      ctx.textAlign='center';
      ctx.textBaseline='middle';
      ctx.fillText(t.word,x2d,y2d);
    });
  });
  requestAnimationFrame(animate);
}
animate();

// ---------------- Interaction ----------------
canvas.addEventListener('click', e=>{
  agents[Math.floor(Math.random()*agents.length)].neuroPulse();
});
let dragging=false, lastX,lastY;
canvas.addEventListener('mousedown',e=>{dragging=true; lastX=e.clientX; lastY=e.clientY;});
canvas.addEventListener('mousemove',e=>{
  if(dragging){
    let dx=e.clientX-lastX, dy=e.clientY-lastY;
    angleY+=dx*0.0005; angleX+=dy*0.0005;
    lastX=e.clientX; lastY=e.clientY;
  }
});
canvas.addEventListener('mouseup',e=>{dragging=false;});
canvas.addEventListener('mouseleave',e=>{dragging=false;});
window.addEventListener('resize',()=>{
  canvas.width=window.innerWidth;
  canvas.height=window.innerHeight;
});
</script>
</body>
</html>
